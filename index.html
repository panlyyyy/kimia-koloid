            { id: 47, question: "Yang termasuk peristiwa penghamburan cahaya dalam kehidupan sehari-hari:\n1. sorot lampu malam kabut\n2. sorot lampu neon di ruang tamu\n3. berkas sinar matahari pagi melalui celah sinar\n4. sorot lampu proyektor di gedung bioskop\nNama peristiwa dan yang termasuk peristiwa penghamburan cahaya:", options: ["efek Tyndall: 1, 2, 3, 4", "efek Tyndall: 1, 3, 4", "efek Tyndall: 1, 2, 3", "gerak Brown: 1, 2, 3, 4", "gerak Brown: 1, 3, 4"], answer: "B" },
            { id: 48, question: "Senyawa berikut yang tidak dapat disebut sebagai emulsi adalah..........", options: ["susu", "santan", "mentega", "sirup", "keju"], answer: "D" },
            { id: 49, question: "Air sungai yang keruh diambil, kemudian disaring dengan menggunakan kertas saring. Pada kertas saring tertinggal residu. Filtrat berupa cairan agak keruh yang menghamburkan berkas cahaya. Berdasarkan percobaan dapat disimpulkan bahwa air sungai merupakan..........", options: ["koloid", "suspensi dan koloid", "larutan dan koloid", "suspensi", "larutan dan suspensi"], answer: "B" },
            { id: 50, question: "Pernyataan tentang elektroforesis berikut ini yang tidak benar adalah..........", options: ["elektroforesis dapat menunjukkan bahwa partikel koloid bermuatan", "koloid negatif akan bergerak ke Anoda", "koloid positif akan bergerak ke Anoda", "proses elektroforesis memerlukan arus listrik searah", "elektroforesis dapat digunakan untuk menunjukkan muatan koloid"], answer: "C" },
            { id: 51, question: "Berikut ini yang termasuk cara dispersi dalam pembuatan koloid adalah..........", options: ["cara mekanik", "peptisasi", "cara busur Bredig", "penggantian pelarut", "peptonisasi"], answer: "A" },
            { id: 52, question: "Pendangkalan bendungan/pembentukan delta terjadi karena perairan mengandung partikel-partikel koloid bermuatan....... yang mengalami peristiwa....", options: ["negatif, absorpsi", "positif, absorpsi", "positif, elektroforesis", "negatif, koagulasi", "positif, koagulasi"], answer: "D" },
            { id: 53, question: "Berikut ini:\n1. belerang dan gula direbus kemudian diaduk dengan air\n2. larutan FeCl₃ dilarutkan dalam air mendidih\n3. Ke dalam larutan As₂S₃ dialirkan gas H₂S\n4. Amilum dalam air dipanaskan\nYang termasuk pembuatan koloid dengan cara kondensasi, yaitu..........", options: ["1 dan 2", "1 dan 3", "1 dan 4", "2 dan 3", "2 dan 4"], answer: "D" },
            { id: 54, question: "Pembuatan koloid dengan menggunakan reaksi redoks adalah..........", options: ["larutan AgNO₃ dicampur HCl", "larutan As₂O₃ dicampur dengan larutan H₂S jenuh", "larutan FeCl₃ jenuh diteteskan ke dalam air mendidih", "larutan Ca(CH₃COO)₂ jenuh dicampur dengan etanol", "gas H₂S dialirkan ke dalam larutan SO₂"], answer: "E" },
            { id: 55, question: "Pembuatan koloid dengan hidrolisis adalah..........", options: ["H₂S(g) + SO₂(g) → 2H₂O(l) + 3S(s)", "2H₃AsO₃(aq) + 3H₂S(g) → As₂S₃(s) + 6H₂O(l)", "FeCl₃(aq) + H₂O(l) → Fe(OH)₃(s) + 3HCl(aq)", "AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq)", "2AuCl₃(aq) + HCHO(aq) → 2Au(s) + 6HCl(aq) + 3HCOOH(aq)"], answer: "C" },
            { id: 56, question: "Untuk mencuci pakaian yang kotor, digunakan sabun. Ditinjau dari sifat dan fungsinya maka sabun sebagai.......... dan..........", options: ["pemutih dan penurun tegangan permukaan air", "pengemulsi dan penurun tegangan permukaan air", "pengemulsi dan menaikkan tegangan air", "pelarut kotoran dan pengemulsi", "pengkoagulasi dan pengemulsi"], answer: "B" },
            { id: 57, question: "Larutan manakah yang dalam air panas menunjukkan efek Tyndall?", options: ["NaCl 0,1 M", "FeCl₃ 0,1 M", "FeCl₂ 0,1 M", "AgNO₃ 0,1 M", "CuSO₄ 0,1 M"], answer: "B" },
            { id: 58, question: "Cara pembuatan koloid dengan mengubah suspensi menjadi koloid disebut..........", options: ["dispersi", "hidrolisis", "elektrolisis", "kondensasi", "koagulasi"], answer: "A" },
            { id: 59, question: "Mayonaise merupakan emulsi.......... dalam.......... yang dapat stabil karena adanya.........", options: ["minyak-air-santan", "air-minyak-susu", "minyak-air-susu", "minyak-air-kuning telur", "air-minyak-kuning telur"], answer: "D" },
            { id: 60, question: "Dispersi zat cair atau zat padat dalam gas disebut:", options: ["sol", "aerosol", "emulsi", "buih", "suspensi"], answer: "B" },
            { id: 61, question: "Elektron yang paling efektif untuk mengendapkan sol Fe(OH)₃ adalah larutan..........", options: ["kalium klorida", "barium sulfat", "ammonium klorida", "alumunium sulfat", "ammonium pospat"], answer: "E" },
            { id: 62, question: "Larutan yang paling efektif mengendapkan sol As₂S₃ dengan konsentrasi sama adalah..........", options: ["NaCl", "Ca(NO₃)₂", "Na₂SO₄", "AlCl₃", "KNO₃"], answer: "D" },
            { id: 63, question: "Kation yang paling baik untuk mengendapkan kotoran halus pada perairan adalah..........", options: ["Al³⁺", "Na⁺", "Ca²⁺", "Mg²⁺", "H⁺"], answer: "A" },
            { id: 64, question: "Terjadinya koagulasi pada sistem koloid disebabkan oleh..........", options: ["halusnya ukuran butiran koloid", "penbanahan senyawa elektrolit sistem koloid", "adanya gerak zig zag partikel koloid", "adanya gerakan lurus terus menerus pada partikel-partikel koloid", "penghamburan berkas sinar oleh partikel-partikel koloid"], answer: "B" },
            { id: 65, question: "Pernyataan yang tepat tentang gerak Brown adalah:", options: ["gerakan partikel koloid yang dapat dilihat dengan mikroskop biasa", "gerakan tumbukan yang tidak seimbang partikel koloid dengan molekul pendispersi", "gerakan tumbukan yang seimbang partikel koloid dengan molekul medium pendispersi", "gerakan medium pendispersi ke segala arah", "partikel-partikel koloid menghamburkan cahaya"], answer: "B" },
            { id: 66, question: "Suatu partikel koloid dapat bermuatan positif atau negatif. Hal ini terjadi karena..........", options: ["partikelnya mengalami ionisasi", "zat pendispersinya bermuatan", "partikel koloid termasuk senyawa ion", "partikel koloid mengadsorpsi ion-ion", "partikel koloid mengadsorpsi ion-ion"], answer: "D" },
            { id: 67, question: "Prinsip kerja alat Cottrell adalah dengan cara...", options: ["elektroforesis", "dialisis", "adsorpsi", "efek Tyndall", "elektrolisis"], answer: "A" },
            { id: 68, question: "Sistem koloid yang mempunyai muatan negatif terdapat pada..........", options: ["Fe(OH)₃", "AgCl", "Al(OH)₃", "FeCl₃", "As₂S₃"], answer: "E" },
            { id: 69, question: "Terbentuknya delta di muara sungai disebabkan oleh..........", options: ["koagulasi koloid lumpur di tepi sungai oleh air laut", "lumpur sungai bergabung membentuk partikel yang lebih besar", "lumpur sungai mengadsorpsi kotoran-kotoran lumpur", "peristiwa elektroforesis partikel koloid lumpur", "peristiwa dialisis partikel koloid lumpur"], answer: "A" },
            { id: 70, question: "Proses ini yang merupakan aplikasi dari sifat koagulasi pada koloid adalah..........", options: ["penjernihan minyak goreng dengan menambahkan arang aktif", "pengolahan air bersih dengan menambahkan tawas", "pengolahan es krim dengan menambahkan gelatin", "penambahan emulgator pada pembuatan emulsi antara minyak dan air", "pembentukan gel pada pertumbuhan selai"], answer: "B" },
            { id: 71, question: "Partikel yang tidak dapat menembus kertas selofan yang bersifat semipermiabel adalah..........", options: ["larutan urea", "larutan urea", "larutan garam dapur", "asam asetat", "kanji"], answer: "E" },
            { id: 72, question: "Yang tidak dapat membentuk koloid hidrofil bila didispersikan ke dalam air adalah..........", options: ["belerang", "selai nanas", "gelatin", "agar-agar", "kanji"], answer: "A" },
            { id: 73, question: "Zat-zat berikut ini:\n1. lem kanji 3. emas\n2. Selai 4. Fe(OH)₃\nYang termasuk koloid adalah..........", options: ["1 dan 2", "1 dan 3", "2 dan 4", "3 dan 4", "1, 2, 3, dan 4"], answer: "E" },
            { id: 74, question: "Larutan elektrolit yang paling baik untuk mengendapkan koloid sol As₂S₃ adalah..........", options: ["K₃PO₄", "MgSO₄", "NaNO₃", "FeSO₄", "Fe₂(SO₄)₃"], answer: "E" },
            { id: 75, question: "Diketahui beberapa sistem koloid:\n1. Fe(OH)₃ 3. agar-agar\n2. sol belerang 4. Gelatin\nKoloid yang bersifat liofob adalah..........", options: ["3 dan 4", "2 dan 3", "1 dan 2", "1 dan 3", "1 dan 4"], answer: "C" },
            { id: 76, question: "Sistem koloid yang dibuat dengan cara dispersi terdapat pada..........", options: ["larutan jenuh kalsium asetat dalam alkohol", "larutan FeCl₃ diteteskan ke dalam air mendidih", "larutan HCl ditambahkan ke dalam larutan Na₂S₂O₃", "gas H₂S dialirkan ke dalam larutan As₂O₃", "agar-agar dipeptisasikan ke dalam air panas"], answer: "E" },
            { id: 77, question: "Kelompok senyawa di bawah ini semuanya emulsi, kecuali..........", options: ["santan dan minyak bumi", "susu dan lateks", "santan dan mayonaise", "krim kocok dan tinta tulis", "mayonaise dan minyak ikan"], answer: "D" },
            { id: 78, question: "Salah satu sifat sol liofob adalah..........", options: ["reversibel", "viskositas tinggi", "efek Tyndall lebih jelas", "tidak menarik partikel medium cairnya", "sukar dikoagulasikan dengan penambahan"], answer: "D" },
            { id: 79, question: "Proses cuci darah dapat dilakukan bagi penderita gagal ginjal, yang disebut..........", options: ["gerak Brown", "efek Tyndall", "elektroforesis", "dialisis", "elektrolisis"], answer: "D" },
            { id: 80, question: "Pada pembuatan es krim digunakan.......... untuk mencegah pembentukan kristal.", options: ["susu", "santan", "telur", "kanji", "gelatin"], answer: "E" },
            { id: 81, question: "Berikut ini adalah beberapa koloid:\n1. air berlumpur\n2. sol emas\n3. sol belerang\n4. Sol Fe(OH)₃\nYang merupakan koloid positif adalah..........", options: ["1 dan 2", "2 dan 4", "1, 3, dan 4", "2, 4, dan 5", "2, 3, dan 5"], answer: "B" },
            { id: 82, question: "Dengan konsentrasi yang sama, larutan elektrolit yang paling efektif untuk menggumpalkan koloid lumpur yaitu..........", options: ["Al₂(SO₄)₃", "Na₂SO₄", "Ba(NO₃)₂", "KBr", "MgCl₂"], answer: "A" },
            { id: 83, question: "Pemberian klorit atau kaporit proses pengolahan air minum bertujuan untuk..........", options: ["menghilangkan bahan-bahan yang menyebabkan pencemaran air", "mengendapkan batu segar pada air", "mengendapkan partikel koloid dalam air", "menghilangkan bau dari kaporit", "membunuh kuman yang berbahaya dalam air"], answer: "E" },
            { id: 84, question: "Pemberian kapur tohor pada proses pengolahan air minum bertujuan untuk..........", options: ["terjadi koagulasi yang lebih cepat", "mengendapkan partikel koloid dalam air", "menghilangkan bau dari kaporit", "menaikkan pH air sehingga menjadi air", "membunuh kuman air sehingga menjadi air"], answer: "D" },
            { id: 85, question: "Pembuatan koloid dapat dilakukan dengan cara menambahkan:\n1. larutan FeCl₃ ke dalam air panas\n2. agar-agar dipeptisasi oleh air\n3. larutan As₂O₃ ke dalam larutan H₂\n4. campuran belerang dan gula pasir halus ke dalam air\nProses yang menunjukkan pembuatan koloid dengan cara dispersi adalah..........", options: ["1 dan 2", "1 dan 3", "2 dan 3", "1 dan 4", "2 dan 4"], answer: "E" }
        ];

        let questions = [];
        let currentIdx = 0;
        let answers = {};
        let doubts = {};
        let timeLeft = 5400;
        let timerInterval;
        let isFinished = false;

        function escapeHTML(str) {
            if (!str) return "";
            const map = { '&': '&', '<': '<', '>': '>', '"': '"', "'": '&#039;' };
            return String(str).replace(/[&<>"']/g, m => map[m]);
        }

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function shuffleQuestionsAndOptions() {
            questions = shuffle(MASTER_DATA);
            questions.forEach(q => {
                if (q.options && q.options.length > 0 && q.answer) {
                    const correctIndex = q.answer.charCodeAt(0) - 65;
                    if (correctIndex >= 0 && correctIndex < q.options.length) {
                        const correctText = q.options[correctIndex];
                        q.options = shuffle(q.options);
                        const newIdx = q.options.indexOf(correctText);
                        q.answer = newIdx !== -1 ? String.fromCharCode(65 + newIdx) : q.answer;
                    }
                }
            });
        }

        function hideLoader() {
            const loader = document.getElementById('loader');
            if (loader && !loader.classList.contains('hidden')) {
                loader.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => loader.remove(), 300);
            }        }

        function init() {
            try {
                shuffleQuestionsAndOptions();
                renderSidebar();
                updateQuestion();
                startTimer();
                if (window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons();
            } catch (err) {
                console.error("Init Error:", err);
                document.getElementById('loader').innerHTML = `<div class="text-center"><p class="text-rose-600 font-bold mb-2">⚠️ Error</p><p class="text-xs text-slate-500 mb-4">${err.message}</p><button onclick="location.reload()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold">Reload</button></div>`;
            } finally {
                setTimeout(hideLoader, 2000);
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (isFinished) return;
                timeLeft--;
                if (timeLeft <= 0) { clearInterval(timerInterval); finishExam(); return; }
                const h = Math.floor(timeLeft / 3600);
                const m = Math.floor((timeLeft % 3600) / 60);
                const s = timeLeft % 60;
                const el = document.getElementById('timer-display');
                if (el) el.textContent = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }, 1000);
        }

        function updateQuestion() {
            const q = questions[currentIdx];
            if (!q) return;

            const qNum = document.getElementById('q-number-tag');
            if (qNum) qNum.textContent = `SOAL ${currentIdx + 1}`;

            const qText = document.getElementById('q-text');
            if (qText) qText.innerHTML = escapeHTML(q.question);

            const codeCont = document.getElementById('q-code-container');
            const codeEl = document.getElementById('q-code');
            if (q.code) {
                codeCont?.classList.remove('hidden');
                if (codeEl) codeEl.textContent = q.code;
            } else {
                codeCont?.classList.add('hidden');
            }

            const sub = document.getElementById('q-sub');            if (q.subQuestion) {
                sub?.classList.remove('hidden');
                const subP = sub?.querySelector('p');
                if (subP) subP.innerHTML = escapeHTML(q.subQuestion);
            } else {
                sub?.classList.add('hidden');
            }

            const grid = document.getElementById('options-grid');
            if (grid) {
                grid.innerHTML = '';
                q.options.forEach((opt, i) => {
                    const char = String.fromCharCode(65 + i);
                    const isSel = answers[currentIdx] === char;
                    const isCorr = q.answer === char;
                    let c = "w-full option-card p-4 rounded-2xl border-2 transition-all cursor-pointer ";
                    let ic = "w-8 h-8 shrink-0 rounded-xl flex items-center justify-center font-black text-xs ";

                    if (isFinished) {
                        if (isCorr) { c += "border-emerald-500 bg-emerald-50 text-emerald-900"; ic += "bg-emerald-500 text-white"; }
                        else if (isSel && !isCorr) { c += "border-rose-500 bg-rose-50 text-rose-900"; ic += "bg-rose-500 text-white"; }
                        else { c += "border-slate-100 bg-white opacity-60 cursor-not-allowed"; ic += "bg-slate-100 text-slate-400"; }
                    } else {
                        if (isSel) { c += "border-indigo-600 bg-indigo-50/50 text-indigo-900 shadow-sm"; ic += "bg-indigo-600 text-white shadow-md"; }
                        else { c += "border-slate-100 bg-white hover:border-slate-300 hover:bg-slate-50"; ic += "bg-slate-100 text-slate-400"; }
                    }

                    const btn = document.createElement('button');
                    btn.className = c; btn.disabled = isFinished;
                    btn.onclick = () => !isFinished && selectOption(char);
                    btn.innerHTML = `<div class="${ic}">${char}</div><span class="option-text text-sm font-bold">${escapeHTML(opt)}</span>`;
                    grid.appendChild(btn);
                });
            }

            const badge = document.getElementById('correction-badge');
            if (badge) {
                if (isFinished) {
                    badge.classList.remove('hidden');
                    const u = answers[currentIdx];
                    badge.textContent = u === q.answer ? "BENAR" : (u ? "SALAH" : "KOSONG");
                    badge.className = `px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider ${u === q.answer ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`;
                } else badge.classList.add('hidden');
            }

            document.getElementById('btn-prev').disabled = currentIdx === 0;
            if (currentIdx === questions.length - 1) {
                document.getElementById('btn-next')?.classList.add('hidden');
                if (!isFinished) document.getElementById('btn-finish')?.classList.remove('hidden');
            } else {                document.getElementById('btn-next')?.classList.remove('hidden');
                document.getElementById('btn-finish')?.classList.add('hidden');
            }

            const btnDoubt = document.getElementById('btn-doubt');
            const doubtText = document.getElementById('doubt-text');
            if (btnDoubt && doubtText) {
                btnDoubt.className = doubts[currentIdx] ? "flex items-center gap-2 px-3 py-1.5 rounded-lg text-[10px] font-black border border-amber-500 bg-amber-500 text-white shadow-sm" : "flex items-center gap-2 px-3 py-1.5 rounded-lg text-[10px] font-black border border-slate-200 text-slate-400";
                doubtText.textContent = doubts[currentIdx] ? "DITANDAI RAGU" : "RAGU-RAGU";
            }

            updateProgress();
            renderSidebar();

            try {
                if (window.MathJax && typeof MathJax.typesetPromise === 'function') MathJax.typesetPromise().catch(() => {});
            } catch(e) {}
        }

        function selectOption(char) { if (!isFinished) { answers[currentIdx] = char; updateQuestion(); } }
        function toggleDoubt() { if (!isFinished) { doubts[currentIdx] = !doubts[currentIdx]; updateQuestion(); } }
        function nextQ() { if (currentIdx < questions.length - 1) { currentIdx++; updateQuestion(); scrollToTop(); } }
        function prevQ() { if (currentIdx > 0) { currentIdx--; updateQuestion(); scrollToTop(); } }
        function jumpTo(idx) { currentIdx = idx; updateQuestion(); if (window.innerWidth < 1024) toggleSidebar(); scrollToTop(); }
        function scrollToTop() { document.querySelector('main')?.scrollTo({ top: 0, behavior: 'smooth' }); }
        function updateProgress() { const p = (Object.keys(answers).length / questions.length) * 100; const b = document.getElementById('top-progress'); if (b) b.style.width = `${p}%`; }

        function renderSidebar() {
            const grid = document.getElementById('grid-nav');
            if (!grid) return;
            grid.innerHTML = '';
            questions.forEach((q, i) => {
                const btn = document.createElement('button');
                const isAns = answers[i] !== undefined, isDbt = doubts[i] === true, isAct = currentIdx === i;
                let cls = "h-10 rounded-xl text-[10px] font-black transition-all border-2 focus:outline-none ";
                if (isFinished) {
                    if (answers[i] === q.answer) cls += "bg-emerald-500 border-emerald-500 text-white ";
                    else if (answers[i]) cls += "bg-rose-500 border-rose-500 text-white ";
                    else cls += "bg-slate-200 border-slate-200 text-slate-500 ";
                } else {
                    if (isAns && isDbt) cls += "bg-indigo-600 border-amber-500 text-white ";
                    else if (isAns) cls += "bg-indigo-600 border-indigo-600 text-white ";
                    else if (isDbt) cls += "bg-white border-amber-500 text-amber-500 ";
                    else cls += "bg-white border-slate-200 text-slate-400 hover:border-slate-300 ";
                }
                if (isAct) cls += "ring-2 ring-indigo-400 ring-offset-1 ";
                btn.className = cls; btn.textContent = i + 1; btn.onclick = () => jumpTo(i);
                grid.appendChild(btn);
            });
        }
        function toggleSidebar() {
            document.getElementById('sidebar')?.classList.toggle('translate-x-full');
            document.getElementById('overlay')?.classList.toggle('active');
        }

        function finishExam() {
            if (isFinished) return;
            clearInterval(timerInterval);
            isFinished = true;
            let correct = 0;
            questions.forEach((q, i) => { if (answers[i] === q.answer) correct++; });
            const finalScore = Math.round((correct / questions.length) * 100);
            document.getElementById('final-score').textContent = finalScore;
            document.getElementById('final-summary').textContent = `Menjawab ${correct} dari ${questions.length} soal dengan benar.`;
            document.getElementById('modal-result')?.classList.remove('hidden');
            document.getElementById('timer-box')?.classList.add('hidden');
            document.getElementById('main-submit-btn')?.classList.add('hidden');
            document.getElementById('btn-finish')?.classList.add('hidden');
            updateQuestion();
        }

        function closeResult() { document.getElementById('modal-result')?.classList.add('hidden'); }

        function safeInit() {
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
        }
        safeInit();
    </script>
